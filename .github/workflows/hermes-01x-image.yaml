# Build and publish the Hermes image for OpenShell 0.1.x (derekhsu/NemoClaw#52)
# from agents/hermes-01x. Fork-only manual workflow, modelled on
# hermes-local-uploader-image.yaml (the OpenShell 0.0.x lane).
#
# The 0.1.x line never moves the 0.0.x release aliases: it publishes only
# openshell01x-* tags and never touches `latest` or `hermes-<calver>`.
#
# The tag always names the bundled Hermes Agent version, read from the pinned
# Dockerfile.base ARGs so it cannot drift from the image contents:
#   openshell01x-hermes-<semver>-<release>          multi-arch
#   openshell01x-hermes-<semver>-<release>-<arch>   per arch
#
# Required Actions secrets on this fork:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# Trigger manually and provide the release date, e.g. 2026.11.7, which
# publishes openshell01x-hermes-0.21.3-2026.11.7.

name: Images / Hermes OpenShell 0.1.x

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release date (for example 2026.11.7); the tag becomes openshell01x-hermes-<semver>-<release>"
        required: true
        type: string


env:
  IMAGE_NAME: docker.io/derekhsu/openshell-hermes
  BASE_IMAGE_NAME: docker.io/derekhsu/hermes-sandbox-base

jobs:
  build-platform:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Validate release
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[0-9]{4}\.[0-9]{1,2}\.[0-9]{1,2}(\.[0-9]{1,3})?$ ]] || {
            echo 'ERROR: release must look like 2026.11.7 (optionally .N)' >&2; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The managed base image is fork-local: agents/hermes-01x/Dockerfile.base
      # carries the security/patch layer the final image depends on and its
      # pinned upstream digest does not track this branch. Build it per-arch in
      # the same job and feed it to the final build through BASE_IMAGE so the
      # source/patch SHA contract stays coherent.
      - name: Guard production build args
        run: |
          set -euo pipefail
          scripts/check-production-build-args.sh
          scripts/check-production-build-args.sh --build-arg "BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}:ci-01x-${{ github.run_id }}-${{ matrix.arch }}"

      - name: Build and push ${{ matrix.platform }} base image
        id: base
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: agents/hermes-01x/Dockerfile.base
          platforms: ${{ matrix.platform }}
          tags: ${{ env.BASE_IMAGE_NAME }}:ci-01x-${{ github.run_id }}-${{ matrix.arch }}
          push: true
          cache-from: type=gha,scope=base-01x-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=base-01x-${{ matrix.arch }}

      # Push only the canonical digest. Named tags are created by the manifest
      # job after both platform digests exist.
      - name: Build and push ${{ matrix.platform }} image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: agents/hermes-01x/Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE_NAME }}:ci-01x-${{ github.run_id }}-${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=final-01x-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=final-01x-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record platform digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid digest: $digest" >&2
            exit 1
          fi
          mkdir -p digests
          printf '%s\n' "${{ env.IMAGE_NAME }}@${digest}" > "digests/${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-digest-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  publish-manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    needs: build-platform
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: platform-digest-*
          path: digests
          merge-multiple: true

      # The tag names the bundled Hermes Agent version, derived from the
      # pinned Dockerfile.base ARGs so it always matches the image contents.
      - name: Resolve tag from the bundled Hermes version
        id: tag
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          set -euo pipefail
          semver="$(grep -oP 'ARG HERMES_SEMVER=\K\S+' agents/hermes-01x/Dockerfile.base | head -n1)"
          if [[ ! "$semver" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: could not parse HERMES_SEMVER from Dockerfile.base" >&2
            exit 1
          fi
          tag="openshell01x-hermes-${semver}-${RELEASE}"
          [[ "$tag" =~ ^openshell01x-hermes-[0-9.]+-[0-9.]+$ ]] || {
            echo "ERROR: unexpected tag: $tag" >&2; exit 1; }
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "publishing ${tag}"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Docker's overlay2 storage driver refuses an image with more than 125
      # layers (#70).
      # Check both platform images before any tag points at them.
      - name: Check image layer count
        run: scripts/check-image-layer-count.sh "$(cat digests/amd64.txt)" "$(cat digests/arm64.txt)"

      - name: Create multi-arch manifest and arch tags
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          amd64_ref="$(cat digests/amd64.txt)"
          arm64_ref="$(cat digests/arm64.txt)"
          docker buildx imagetools create -t "${IMAGE_NAME}:${TAG}" "$amd64_ref" "$arm64_ref"
          docker buildx imagetools create -t "${IMAGE_NAME}:${TAG}-amd64" "$amd64_ref"
          docker buildx imagetools create -t "${IMAGE_NAME}:${TAG}-arm64" "$arm64_ref"

      - name: Verify published manifest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}"
          echo "published manifest digest:"
          docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${IMAGE_NAME}:${TAG}"
