# Build the OpenClaw tools image (issue #16) on native amd64 and arm64
# runners, run its fixtures offline as the sandbox user, and scan it.
# Fork-only verification: this workflow never pushes an image.

name: Images / OpenClaw Tools Verify

on:
  push:
    branches:
      - "codex/issue-16-*"
    paths:
      - Dockerfile.tools
      - tools/openclaw-tools-image/**
      - .github/workflows/openclaw-tools-image-verify.yaml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-tools-image-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.arch }}
    if: github.repository == 'derekhsu/NemoClaw'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TOOLS_IMAGE: nemoclaw-openclaw-tools:ci
      OUT: ${{ github.workspace }}/tools-image-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      - name: Read base image
        id: base
        run: |
          set -euo pipefail
          ref=$(sed -n 's/^ARG BASE_IMAGE=//p' Dockerfile.tools)
          case "$ref" in *@sha256:*) ;; *) echo "BASE_IMAGE is not digest-pinned: $ref" >&2; exit 1 ;; esac
          echo "ref=$ref" >>"$GITHUB_OUTPUT"

      - name: Build tools image
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          start=$(date +%s)
          DOCKER_BUILDKIT=1 docker build --progress=plain --platform "linux/${{ matrix.arch }}" -f Dockerfile.tools -t "$TOOLS_IMAGE" . 2>&1 | tee "$OUT/build.log"
          echo "build_seconds=$(( $(date +%s) - start ))" | tee "$OUT/build-time.txt"

      - name: Compare with base image
        run: tools/openclaw-tools-image/fixtures/check-image.sh "${{ steps.base.outputs.ref }}" "$TOOLS_IMAGE" "$OUT/image"

      - name: Run fixtures offline as sandbox
        run: |
          set -euo pipefail
          mkdir -p "$OUT/fixtures"
          chmod 0777 "$OUT/fixtures"
          rc=0
          for phase in run-phase2.sh run-phase3.sh; do
            docker run --rm --user sandbox --network none --read-only \
              --tmpfs /tmp:rw,exec,size=2g --cap-drop ALL --security-opt no-new-privileges \
              --entrypoint /bin/bash \
              -v "$PWD/tools/openclaw-tools-image/fixtures:/fixtures:ro" \
              -v "$OUT/fixtures:/out" \
              "$TOOLS_IMAGE" "/fixtures/$phase" || rc=1
          done
          exit "$rc"

      - name: Scan with Trivy
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.TOOLS_IMAGE }}
          format: json
          output: tools-image-evidence/trivy.json
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Summarize Trivy findings
        if: always()
        run: |
          set -euo pipefail
          [ -f "$OUT/trivy.json" ] || exit 0
          jq -r '[.Results[]?.Vulnerabilities[]?] as $v
            | "fixable: \([$v[] | select(.FixedVersion != null and .FixedVersion != "")] | length)",
              "unfixed: \([$v[] | select(.FixedVersion == null or .FixedVersion == "")] | length)"' \
            "$OUT/trivy.json" | tee "$OUT/trivy-summary.txt"

      - name: Scan base image with Trivy
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.base.outputs.ref }}
          format: json
          output: tools-image-evidence/trivy-base.json
          severity: CRITICAL,HIGH
          exit-code: "0"

      # Release rule: the tools layer adds no fixable CRITICAL or HIGH
      # finding. Findings inherited from the base are fixed by rebuilding
      # the standard image.
      - name: Reject findings added by the tools layer
        run: |
          python3 tools/openclaw-tools-image/fixtures/trivy-new-findings.py \
            "$OUT/trivy-base.json" "$OUT/trivy.json" "$OUT/trivy-added.json"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-image-evidence-${{ matrix.arch }}
          path: tools-image-evidence
          retention-days: 30
