# Build and publish the ClawShell Hermes local-uploader managed image to
# Docker Hub. Fork-only manual workflow: the upstream managed-images lane is
# gated to NVIDIA/NemoClaw and never pushes from forks, so this lane builds
# agents/hermes/Dockerfile per-arch on native runners and promotes a
# multi-arch manifest on derekhsu/openshell-hermes.
#
# Required Actions secrets on this fork:
#   DOCKERHUB_USERNAME, DOCKERHUB_TOKEN
#
# Trigger manually and provide the release tag, e.g. 2026.9.11.

name: Images / Hermes Local Uploader

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker Hub tag to publish (for example 2026.9.11)"
        required: true
        type: string

env:
  IMAGE_NAME: docker.io/derekhsu/openshell-hermes

jobs:
  build-platform:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Push only the canonical digest. Named tags are created by the manifest
      # job after both platform digests exist.
      - name: Build and push ${{ matrix.platform }} image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: agents/hermes/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Record platform digest
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid digest: $digest" >&2
            exit 1
          fi
          mkdir -p digests
          printf '%s\n' "${{ env.IMAGE_NAME }}@${digest}" > "digests/${{ matrix.arch }}.txt"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: platform-digest-${{ matrix.arch }}
          path: digests/
          retention-days: 1

  publish-manifest:
    name: Publish multi-arch manifest
    runs-on: ubuntu-24.04
    needs: build-platform
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: platform-digest-*
          path: digests
          merge-multiple: true

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create multi-arch manifest and arch tags
        run: |
          set -euo pipefail
          amd64_ref="$(cat digests/amd64.txt)"
          arm64_ref="$(cat digests/arm64.txt)"
          docker buildx imagetools create \
            -t "${{ env.IMAGE_NAME }}:${{ inputs.tag }}" \
            -t "${{ env.IMAGE_NAME }}:latest" \
            "$amd64_ref" "$arm64_ref"
          docker buildx imagetools create \
            -t "${{ env.IMAGE_NAME }}:${{ inputs.tag }}-amd64" "$amd64_ref"
          docker buildx imagetools create \
            -t "${{ env.IMAGE_NAME }}:${{ inputs.tag }}-arm64" "$arm64_ref"

      - name: Verify published manifest
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
          echo "published manifest digest:"
          docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' \
            "${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
