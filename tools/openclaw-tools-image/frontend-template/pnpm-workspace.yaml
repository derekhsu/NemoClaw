# The OpenClaw tools image ships this template with node_modules installed.
# Do not reinstall before `pnpm run` or `pnpm exec`; that needs the network.
verifyDepsBeforeRun: false

# html-inline pulls minimist 0.0.10 and 1.1.3 (CVE-2021-44906). It only parses
# command-line arguments, which minimist 1.2.8 handles the same way.
overrides:
  minimist: 1.2.8

# Prebuilt platform packages supply these native bindings. Deny install
# scripts so installs never compile or download.
allowBuilds:
  '@parcel/watcher': false
  '@swc/core': false
  lmdb: false
  msgpackr-extract: false
