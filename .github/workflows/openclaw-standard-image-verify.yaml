# Build the standard OpenClaw image (Dockerfile.base + Dockerfile) on native
# amd64 and arm64 runners and scan it with Trivy for each pull request to
# feat/image-only-cli (#19).
# Fork-only verification: this workflow never logs in to a registry and never
# pushes an image. openclaw-sandbox-image.yaml publishes the release.

name: Images / OpenClaw Standard Verify

on:
  pull_request:
    branches:
      - feat/image-only-cli
    paths:
      - Dockerfile
      - Dockerfile.base
      - .github/workflows/openclaw-standard-image-verify.yaml
      - scripts/patch-bundled-npm-*.mts
      - scripts/lib/patch-bundled-npm-*.mts
      - scripts/upgrade-bundled-npm.mts
      - scripts/security/**
      - scripts/check-brew-nested-landlock.sh
      - scripts/lib/landlock-no-root-readdir.pl
      - ci/trivy-standard-image-exceptions.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: openclaw-standard-image-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify ${{ matrix.arch }}
    if: github.repository == 'derekhsu/NemoClaw'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      BASE_IMAGE: nemoclaw-openclaw-sandbox-base:verify
      STANDARD_IMAGE: nemoclaw-openclaw-standard:verify
      OUT: ${{ github.workspace }}/standard-image-evidence
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free runner disk space
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null
          df -h /

      # The docker driver keeps both builds in the runner's image store, so the
      # "Build standard image" step reads the image that "Build base image" loaded.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          driver: docker

      - name: Check production build args
        run: |
          set -euo pipefail
          scripts/check-production-build-args.sh
          scripts/check-production-build-args.sh --build-arg "BASE_IMAGE=${BASE_IMAGE}"
          mkdir -p "$OUT"

      # Same Dockerfiles and build order as the standard job in
      # openclaw-sandbox-image.yaml, without a registry push.
      - name: Build base image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.base
          platforms: linux/${{ matrix.arch }}
          tags: ${{ env.BASE_IMAGE }}
          load: true

      - name: Build standard image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/${{ matrix.arch }}
          build-args: |
            BASE_IMAGE=${{ env.BASE_IMAGE }}
          tags: ${{ env.STANDARD_IMAGE }}
          load: true

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.STANDARD_IMAGE }}
          format: json
          output: standard-image-evidence/trivy.json
          severity: CRITICAL,HIGH
          exit-code: "0"

      # Release rule: the standard image ships no CRITICAL or HIGH finding
      # that has a fixed version, unless an exact, unexpired entry in
      # ci/trivy-standard-image-exceptions.json covers it. The step summary
      # counts findings that have no fixed version; they do not fail the job.
      - name: Reject fixable CRITICAL and HIGH findings
        run: >-
          scripts/security/reject-fixable-trivy-findings.sh
          "$OUT/trivy.json" ci/trivy-standard-image-exceptions.json "$OUT" "${{ matrix.arch }}"

      # Homebrew inside OpenShell runs under an outer Landlock policy that does
      # not grant read on "/". Install a formula with post-install dependencies
      # under an equivalent sandbox, so a Homebrew bump that breaks in-sandbox
      # installs fails the pull request (Homebrew/brew#24446,
      # HOMEBREW_NO_SANDBOX_LINUX deprecation). Needs formulae.brew.sh and
      # ghcr.io, so it runs here and not on the release path.
      - name: Check brew install under nested Landlock
        run: scripts/check-brew-nested-landlock.sh "$STANDARD_IMAGE"

      - name: Upload Trivy evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: standard-image-evidence-${{ matrix.arch }}
          path: standard-image-evidence
          retention-days: 30
