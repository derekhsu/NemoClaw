[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sandbox-mcp-server"
version = "0.1.0+nemoclaw.1"
description = "MCP server for sandbox file delivery through ClawShell Gateway"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastmcp>=0.4.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
sandbox-mcp-server = "sandbox_mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sandbox_mcp_server"]
